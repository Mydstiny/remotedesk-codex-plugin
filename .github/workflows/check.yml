name: source-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  native-codex:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global --ignore-scripts @openai/codex@0.153.4
      - run: node bin/remotedesk-codex.mjs probe --json
      - run: node test/codex-runtime.mjs

  native-service:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Start an isolated CI runner user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$(id -u)" >> "$GITHUB_ENV"
      - run: node test/service-runtime.mjs
  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global --ignore-scripts @openai/codex@0.153.4
      - name: Build the pinned project image
        shell: bash
        run: |
          docker build -t remotedesk-test packages/bridge-core/sandbox
          printf 'REMOTEDESK_TEST_IMAGE=%s\n' "$(docker image inspect remotedesk-test --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: node test/bridge-runtime.mjs
      - run: node test/recovery-runtime.mjs
